name: Publicar en GitHub Pages

# Publica el tablero en https://tierrafilms.limaretail.com (dominio configurado en Settings > Pages;
# con Actions GitHub ignora el archivo CNAME). Cifra dist/index.html con el secret TF_PAGE_PASSWORD:
# sin esa clave el HTML publicado no se puede leer. Solo se sube dist/: data/, scripts/ y apps-script/ no se publican.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Build
        env:
          TF_PAGE_PASSWORD: ${{ secrets.TF_PAGE_PASSWORD }}
          # CRM de leads (modulo Leads): Web App de la hoja privada. Sin ellos el modulo guarda en el navegador.
          TF_CRM_URL: ${{ secrets.TF_CRM_URL }}
          TF_CRM_TOKEN: ${{ secrets.TF_CRM_TOKEN }}
          # Correos de la alerta (ruedita de Notificaciones): Web App alertas-destinatarios.gs.
          TF_ALERTAS_URL: ${{ secrets.TF_ALERTAS_URL }}
          TF_ALERTAS_TOKEN: ${{ secrets.TF_ALERTAS_TOKEN }}
        run: |
          # Sin clave no se publica: el tablero quedaria abierto a cualquiera con el enlace.
          if [ -z "$TF_PAGE_PASSWORD" ]; then echo "::error::Falta el secret TF_PAGE_PASSWORD"; exit 1; fi
          node scripts/build.js
          # Ultimo control: lo que se sube tiene que ser la pantalla de acceso, no el tablero en claro.
          grep -q 'id="gate-payload"' dist/index.html || { echo "::error::dist/index.html no salio cifrado"; exit 1; }
          if grep -qE 'TIERRA_FILMS_(RETAIL_DATA|DRIVE_SNAPSHOT|CRM|ALERTAS)' dist/index.html; then echo "::error::dist/index.html trae los datos en claro"; exit 1; fi
          if [ -e dist/data ]; then echo "::error::dist/ no debe llevar data/"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
