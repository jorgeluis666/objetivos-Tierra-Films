name: Sincronizar reglas

# Trae a data/reglas.json los cuatro hitos del Ciclo Mensual de Analisis y Optimizacion, que
# ordenan los avisos de la campanita y del correo semanal. La raiz editable es la hoja
# Reglas_Nexus_Tierra Films de la carpeta "08 Reglas y Optimizacion" del Drive de la marca.
#
# Este repositorio no tiene, a diferencia de los otros tableros de marca, un workflow que barra
# Drive donde colgar el paso: scripts/drive-snapshot.py se corre a mano y el tablero lee Drive en
# vivo desde el navegador. Por eso las reglas tienen su propio workflow.
on:
  # Una vez al dia, 06:45 de Lima (11:45 UTC). La hoja se edita muy de vez en cuando, asi que un
  # cron atrasado no hace dano: lo que importa es que el archivo no se quede viejo.
  schedule:
    - cron: '45 11 * * *'

  # A mano desde Actions > Sincronizar reglas > Run workflow, para no esperar al dia siguiente
  # despues de mover un corte en la hoja.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-reglas
  cancel-in-progress: false

jobs:
  reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # El script usa solo la biblioteca estandar: el Python del runner alcanza. La carpeta de
      # reglas esta restringida al equipo, asi que la lee el Web App del Apps Script de LR Suite
      # (TF_REGLAS_URL) con su token. Mientras falten esos dos secretos el paso no falla:
      # data/reglas.json se queda como esta y los avisos salen sin ordenar, como siempre.
      - name: Sincronizar las reglas del ciclo mensual
        id: reglas
        env:
          TF_REGLAS_URL: ${{ secrets.TF_REGLAS_URL }}
          TF_REGLAS_TOKEN: ${{ secrets.TF_REGLAS_TOKEN }}
        run: python3 scripts/sync-reglas.py

      - name: Guardar las reglas nuevas
        if: ${{ steps.reglas.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reglas.json
          git commit -m "Sincroniza las reglas del ciclo mensual desde Drive"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Un push hecho con GITHUB_TOKEN no dispara otros workflows, asi que la publicacion se pide
      # a mano (el tablero lleva las reglas dentro del HTML que arma scripts/build.js).
      - name: Publicar el tablero
        if: ${{ steps.reglas.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Sin novedades
        if: ${{ success() && steps.reglas.outputs.changed != 'true' }}
        run: echo "La hoja de reglas no trajo cambios; el tablero sigue igual."
